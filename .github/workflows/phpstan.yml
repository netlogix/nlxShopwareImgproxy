name: PHPStan Matrix

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  phpstan:
    name: 'PHP ${{ matrix.php-version }} | Shopware ${{ matrix.shopware-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
        shopware-version: ['6.7.1.0', '^6.7.1', 'trunk']

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v6

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          tools: composer
          coverage: 'xdebug3'

      - name: 'Validate composer.json and composer.lock'
        shell: bash
        run: composer validate

      - name: 'Set Shopware Version'
        shell: bash
        run: >
          composer require --no-interaction --no-update
          shopware/core:${{ matrix.shopware-version }}

      - name: 'Install Composer Dependencies'
        shell: bash
        run: >
          composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: 'Run phpstan'
        shell: bash
        run: vendor/bin/phpstan --memory-limit=-1 --error-format=github
